<section class="feedback section" id="feedback">
  <div class="container">
    <h2 class="section-title feedback-title">Відгуки клієнтів</h2>
    <p class="feedback-text">Найкращі десерти, які я коли-небудь куштував!</p>

    <div class="feedback-slider">
      <div class="feedback-swiper swiper">
        <div class="feedback-swiper-wrapper swiper-wrapper"></div>
      </div>

      <div class="feedback-nav-wrapper">
        <div class="feedback-swiper-pagination swiper-pagination"></div>
        <ul class="feedback-nav-list">
          <li class="feedback-nav-item">
            <button class="feedback-nav-btn swiper-button-prev" type="button">
              <svg class="feedback-nav-icon" width="24" height="24">
                <use href="./img/icons.svg#arrow_backicon"></use>
              </svg>
            </button>
          </li>
          <li class="feedback-nav-item">
            <button class="feedback-nav-btn swiper-button-next" type="button">
              <svg class="feedback-nav-icon" width="24" height="24">
                <use href="./img/icons.svg#arrow_forwardicon"></use>
              </svg>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
